<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server bearbeiten – RettMax</title><link rel="stylesheet" href="style.css?v=6"><style>.panel{background:#111827;border:1px solid #273449;border-radius:15px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{display:grid;gap:6px;color:#cbd5e1;font-size:13px;font-weight:700}input,select,textarea{padding:12px;color:white;background:#0b1322;border:1px solid #273449;border-radius:9px;font:inherit}textarea{min-height:76px}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{display:flex;flex-direction:row;align-items:center;font-weight:500;padding:7px 9px;background:#0b1322;border:1px solid #273449;border-radius:8px}.target{padding:14px 0;border-bottom:1px solid #273449}.target h3{margin:0 0 5px}.muted{color:#94a3b8;font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="top"><a class="brand" href="/dashboard" style="text-decoration:none"><img src="RettMax.png" class="brand-logo" alt=""><span>RettMax</span> Editor</a><a id="open" class="auth-link">Open</a></div></header><main><section id="locked" class="panel" hidden><h1>Kein Bearbeitungszugriff</h1><p>Nur der Besitzer kann diesen Server bearbeiten.</p><a class="btn copy" href="/dashboard">Zum Dashboard</a></section><div id="editor" hidden><section class="hero"><h1 id="title">Server bearbeiten</h1><p>Ziele speichern und anschließend im Server zur Navigation öffnen.</p></section><section class="panel"><h2>Neues Ziel</h2><form id="form" class="grid"><label>Name<input id="name" required maxlength="100" placeholder="Zentrale Notaufnahme"></label><label>Kategorie<select id="category"><option>ZNA</option><option>Dialyse</option><option value="Wachen">Wache</option><option>Weitere</option></select></label><label class="full">Adresse<input id="address" required maxlength="180" placeholder="Straße, Hausnummer, PLZ Ort"></label><div id="specialtyBlock" class="full"><label>Fachrichtungen</label><div class="checks"><label><input type="checkbox" value="Allgemeinmedizin">Allgemeinmedizin</label><label><input type="checkbox" value="Anästhesiologie">Anästhesiologie</label><label><input type="checkbox" value="Chirurgie">Chirurgie</label><label><input type="checkbox" value="Gynäkologie">Gynäkologie</label><label><input type="checkbox" value="HNO">HNO</label><label><input type="checkbox" value="Innere Medizin">Innere Medizin</label><label><input type="checkbox" value="Kardiologie">Kardiologie</label><label><input type="checkbox" value="Kinder- und Jugendmedizin">Kinder- und Jugendmedizin</label><label><input type="checkbox" value="Neurologie">Neurologie</label><label><input type="checkbox" value="Neurochirurgie">Neurochirurgie</label><label><input type="checkbox" value="Nephrologie">Nephrologie</label><label><input type="checkbox" value="Onkologie">Onkologie</label><label><input type="checkbox" value="Orthopädie">Orthopädie</label><label><input type="checkbox" value="Pädiatrie">Pädiatrie</label><label><input type="checkbox" value="Psychiatrie">Psychiatrie</label><label><input type="checkbox" value="Radiologie">Radiologie</label><label><input type="checkbox" value="Urologie">Urologie</label></div></div><label>Breitengrad<input id="lat" required type="number" step="any" min="-90" max="90"></label><label>Längengrad<input id="lon" required type="number" step="any" min="-180" max="180"></label><label class="full">Hinweis<textarea id="note" maxlength="300" placeholder="Zufahrt, Eingang oder Hinweis"></textarea></label><button class="btn route">Ziel speichern</button><a id="cancel" class="btn copy">Abbrechen</a></form><p id="status" class="auth-status"></p></section><section class="panel"><h2>Gespeicherte Ziele</h2><div id="targets" class="muted">Wird geladen …</div></section></div></main><script src="auth-config.js"></script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs,addDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const cfg=window.RETTMAX_FIREBASE_CONFIG||{},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),slug=new URLSearchParams(location.search).get("server")?.toLowerCase(),$=x=>document.getElementById(x),say=(t,b=false)=>{$("status").textContent=t;$("status").className="auth-status"+(b?" error":" success")},esc=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);let user;
$("category").onchange=()=>{$("specialtyBlock").hidden=$("category").value!=="ZNA"};
async function list(){const q=await getDocs(collection(db,"servers",slug,"targets")),box=$("targets");box.innerHTML="";if(q.empty){box.textContent="Noch keine Ziele gespeichert.";return}q.forEach(d=>{const t=d.data(),x=document.createElement("article");x.className="target";x.innerHTML="<h3>"+esc(t.name)+"</h3><p class='muted'>"+esc(t.category)+" · "+esc(t.address)+"</p><button class='btn danger'>Ziel löschen</button>";x.querySelector("button").onclick=async()=>{if(confirm("Ziel wirklich löschen?")){await deleteDoc(d.ref);await list()}};box.append(x)})}
async function load(u){user=u;if(!slug||!u){$("locked").hidden=false;return}const s=await getDoc(doc(db,"servers",slug));if(!s.exists()||s.data().ownerUid!==u.uid){$("locked").hidden=false;return}$("editor").hidden=false;$("title").textContent=s.data().name+" bearbeiten";$("open").href="/"+encodeURIComponent(slug);$("cancel").href="/"+encodeURIComponent(slug);await list()}
$("form").onsubmit=async e=>{e.preventDefault();try{const category=$("category").value,specialties=category==="ZNA"?[...document.querySelectorAll("#specialtyBlock input:checked")].map(x=>x.value):[];await addDoc(collection(db,"servers",slug,"targets"),{name:$("name").value.trim(),category,address:$("address").value.trim(),specialties,lat:Number($("lat").value),lon:Number($("lon").value),note:$("note").value.trim(),createdBy:user.uid,createdAt:serverTimestamp()});e.target.reset();$("category").dispatchEvent(new Event("change"));say("Ziel gespeichert.");await list()}catch(e){say(e.message,true)}};
onAuthStateChanged(auth,u=>load(u).catch(e=>say(e.message,true)));
</script></body></html>
