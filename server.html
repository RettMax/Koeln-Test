<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RettMax-Server</title><link rel="stylesheet" href="style.css?v=6"><style>.panel{background:#111827;border:1px solid #273449;border-radius:15px;padding:20px;margin:18px 0}.target{padding:15px 0;border-bottom:1px solid #273449}.target h3{margin:0 0 5px}.muted{color:#94a3b8;font-size:14px}.route-link{display:inline-block;margin-top:8px}</style></head><body><header><div class="top"><a class="brand" href="/dashboard" style="text-decoration:none"><img src="RettMax.png" class="brand-logo" alt=""><span>RettMax</span></a><div class="header-actions"><a class="auth-link" href="/dashboard">Dashboard</a><a id="edit" class="auth-link" hidden>Edit</a></div></div></header><main><section id="locked" class="panel" hidden><h1>Privater Server</h1><p>Du brauchst eine angenommene Einladung, um diesen Server zu öffnen.</p><a class="btn route" href="/dashboard">Zum Dashboard</a></section><section id="missing" class="panel" hidden><h1>Server nicht gefunden</h1><a class="btn copy" href="/dashboard">Zum Dashboard</a></section><div id="content" hidden><section class="hero"><p id="kind" class="status"></p><h1 id="title"></h1><p id="description" class="muted"></p></section><div class="warning"><b>Hinweis:</b> Ziele ersetzen keine rettungsdienstliche Zielentscheidung.</div><section class="panel"><h2>Ziele</h2><div id="targets" class="muted">Wird geladen …</div></section></div><p id="status" class="auth-status"></p></main><script src="auth-config.js"></script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const cfg=window.RETTMAX_FIREBASE_CONFIG||{},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),slug=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"").toLowerCase(),$=x=>document.getElementById(x),esc=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);
async function show(u){let snap;try{snap=await getDoc(doc(db,"servers",slug))}catch(e){$("locked").hidden=false;return}if(!snap.exists()){$("missing").hidden=false;return}const s=snap.data();let member=false;if(u)member=(await getDoc(doc(db,"users",u.uid,"servers",slug))).exists();if(s.visibility==="private"&&!member){$("locked").hidden=false;return}$("content").hidden=false;$("title").textContent=s.name;$("description").textContent=s.description||"";$("kind").textContent=s.visibility==="public"?"Öffentlicher Server":"Privater Server";if(u&&s.ownerUid===u.uid){$("edit").hidden=false;$("edit").href="/edit?server="+encodeURIComponent(slug)}const q=await getDocs(collection(db,"servers",slug,"targets")),box=$("targets");box.innerHTML="";if(q.empty){box.textContent="Noch keine Ziele eingetragen.";return}q.forEach(d=>{const t=d.data(),x=document.createElement("article");x.className="target";const specs=t.specialties?.length?"<p class='muted'>Fachrichtungen: "+esc(t.specialties.join(", "))+"</p>":"";const url="https://www.google.com/maps/dir/?api=1&destination="+t.lat+","+t.lon;x.innerHTML="<h3>"+esc(t.name)+"</h3><p class='muted'>"+esc(t.category)+" · "+esc(t.address)+"</p>"+specs+"<p>"+esc(t.note||"")+"</p><a class='btn route route-link' target='_blank' rel='noopener' href='"+url+"'>Navigation starten</a>";box.append(x)})}
onAuthStateChanged(auth,u=>show(u).catch(e=>{$("status").textContent=e.message;$("status").className="auth-status error"}));
</script></body></html>
